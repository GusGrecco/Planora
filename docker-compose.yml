services:
  postgres:
    image: postgres:18
    container_name: planora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: planora
      POSTGRES_PASSWORD: planora
      POSTGRES_DB: planora
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data: